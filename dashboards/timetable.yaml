# HAiServ timetable dashboard for Home Assistant Lovelace.
#
# Installation:
# 1. Set up HAiServ and verify the entity IDs under Settings > Devices & services
#    > Entities. Home Assistant normally creates sensor.iserv_timetable and
#    sensor.iserv_next_week_timetable, but may add a suffix.
# 2. If necessary, replace every occurrence of both entity IDs in this file.
# 3. In Home Assistant, create/open a dashboard, select Edit dashboard > the
#    three-dot menu > Raw configuration editor, and paste this whole file.
#    For a YAML-mode dashboard, copy this file into the Home Assistant config
#    directory and reference it from the existing lovelace/dashboards config.
#
# The dashboard uses only Home Assistant's built-in Markdown card and the
# integration's `lessons` attribute. No credentials or custom cards are needed.
# The template emits a native Markdown pipe table; raw HTML tables are not
# rendered by the built-in card. Inline <mark>/<strong> highlights the lesson
# currently in progress, with a visible marker as fallback. Multiple lessons
# in one cell use " / ".

title: Stundenplan
views:
  - title: Stundenplan
    path: timetable
    icon: mdi:calendar-week
    cards:
      - type: markdown
        title: Stundenplan
        entity_id:
          - sensor.iserv_timetable
          - sensor.iserv_next_week_timetable
        content: |-
          {% macro timetable(entity, heading, week_offset) -%}
            {% set lessons = state_attr(entity, 'lessons') or [] -%}
            {% set days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'] -%}
            {% set current_day = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'][now().weekday()] -%}
            {% set current_time = now().strftime('%H:%M') -%}
            {% set week_start = now() - timedelta(days=now().weekday()) + timedelta(days=week_offset) -%}
            {% set week_end = week_start + timedelta(days=4) -%}
            {% set date_range = week_start.strftime('%d.%m.') ~ '–' ~ week_end.strftime('%d.%m.%y') -%}
            {% set ns = namespace(slots=[], rows=[
              '| Zeit | Montag | Dienstag | Mittwoch | Donnerstag | Freitag |',
              '| :--- | :--- | :--- | :--- | :--- | :--- |'
            ]) -%}
            {% for lesson in lessons -%}
              {% set slot = lesson.start_time ~ '|' ~ lesson.end_time -%}
              {% if slot not in ns.slots -%}
                {% set ns.slots = ns.slots + [slot] -%}
              {% endif -%}
            {% endfor -%}
            {{ '## ' ~ heading ~ ' (' ~ date_range ~ ')\n\n' -}}
            {% if lessons | count == 0 -%}
              {{ '_Keine Stundenplandaten verfügbar._' -}}
            {% else -%}
              {% for slot in ns.slots | sort -%}
                {% set times = slot.split('|') -%}
                {% set row = namespace(value='| ' ~ times[0] ~ '–' ~ times[1] ~ ' |') -%}
                {% for day in days -%}
                  {% set matches = lessons | selectattr('day', 'eq', day) | selectattr('start_time', 'eq', times[0]) | selectattr('end_time', 'eq', times[1]) | list -%}
                  {% set cell = namespace(items=[]) -%}
                  {% for lesson in matches -%}
                    {% set subject = lesson.subject | replace('|', '\\|') -%}
                    {% set room = lesson.room | default('', true) | replace('|', '\\|') -%}
                    {% set text = subject ~ (' · ' ~ room if room else '') -%}
                    {% set is_current = week_offset == 0 and day == current_day and lesson.start_time <= current_time and current_time < lesson.end_time and not lesson.canceled -%}
                    {% if is_current -%}
                      {% set rendered = '<mark><strong>▶ ' ~ text ~ '</strong></mark>' -%}
                    {% elif lesson.canceled -%}
                      {% set rendered = '~~' ~ text ~ '~~' -%}
                    {% else -%}
                      {% set rendered = '**' ~ text ~ '**' -%}
                    {% endif -%}
                    {% set cell.items = cell.items + [rendered] -%}
                  {% endfor -%}
                  {% set row.value = row.value ~ ' ' ~ (cell.items | join(' / ')) ~ ' |' -%}
                {% endfor -%}
                {% set ns.rows = ns.rows + [row.value] -%}
              {% endfor -%}
              {{ ns.rows | join('\n') -}}
            {% endif -%}
          {%- endmacro %}

          {{ timetable('sensor.iserv_timetable', 'Aktuelle Woche', 0) }}

          {{ timetable('sensor.iserv_next_week_timetable', 'Nächste Woche', 7) }}
